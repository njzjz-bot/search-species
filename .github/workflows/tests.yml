name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Expose CLI names expected by tests
        run: |
          ln -sf search-species .venv/bin/search
          ln -sf render-species .venv/bin/render

      - name: Run tests
        run: uv run --with pytest-rerunfailures pytest -q --reruns 2 --reruns-delay 5
